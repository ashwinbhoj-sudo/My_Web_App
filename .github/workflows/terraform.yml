name: Terraform Deploy to OCI

on:
  push:
    branches:
      - main # Triggers whenever you push changes to main

jobs:
  terraform:
    name: OCI Infrastructure Provisioning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure OCI Credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Terraform Init
        run: cd infra/terraform && terraform init

      - name: Terraform Format Check
        run: cd infra/terraform && terraform fmt -check

      - name: Terraform Plan
        run: cd infra/terraform && terraform plan -out=tfplan
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key_path: "~/.oci/oci_api_key.pem"
          TF_VAR_compartment_id: ${{ secrets.OCI_COMPARTMENT_ID }}
          TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}

      - name: Terraform Apply
        run: cd infra/terraform && terraform apply -auto-approve tfplan
